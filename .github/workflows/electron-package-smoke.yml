name: Electron Package Smoke

on:
    pull_request:
        paths:
            - apps/desktop/package.json
            - apps/desktop/package-lock.json
            - apps/desktop/electron-builder.config.mjs
            - apps/desktop/electron.vite.config.ts
            - apps/desktop/build/**
            - apps/desktop/embedded/**
            - apps/desktop/scripts/**
            - apps/desktop/src-electron/**
            - apps/desktop/native-backend/**
            - vendor/codex-acp/**
            - apps/desktop/runtimes/claude/**
            - rust-toolchain.toml
            - .github/workflows/electron-package-smoke.yml
            - .github/workflows/release-desktop.yml
    workflow_dispatch:

concurrency:
    group: electron-package-smoke-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    claude-runtime:
        name: Claude runtime (${{ matrix.target }}, ${{ matrix.runner }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: ubuntu-26.04
                      target: x86_64-unknown-linux-gnu
                    - runner: ubuntu-26.04-arm
                      target: aarch64-unknown-linux-gnu
                    - runner: windows-latest
                      target: x86_64-pc-windows-msvc
                    - runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
                    - runner: macos-latest
                      target: universal-apple-darwin
                    - runner: macos-15-intel
                      target: universal-apple-darwin
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      apps/desktop/package-lock.json
                      apps/desktop/runtimes/claude/package-lock.json
                      apps/desktop/runtimes/pi/package-lock.json
            - name: Install preparation tools
              working-directory: apps/desktop
              run: npm ci
            - name: Prepare target runtime
              working-directory: apps/desktop
              run: npm run claude:prepare -- --target ${{ matrix.target }}
            - name: Validate preparation and runtime contracts
              working-directory: apps/desktop
              shell: bash
              run: |
                  npm run test:claude-preparation
                  NEVERWRITE_CLAUDE_CONTRACT_RUNTIME="$PWD/.cache/claude-runtime/${{ matrix.target }}" npm run test:claude-runtime
                  npm run test:pi-runtime
            - name: Exercise the real runtime on the native architecture
              working-directory: apps/desktop
              run: npm run claude:smoke -- --runtime .cache/claude-runtime/${{ matrix.target }} --target ${{ matrix.target }}

    macos-universal:
        name: macOS Universal
        runs-on: macos-latest
        timeout-minutes: 120

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      apps/desktop/package-lock.json
                      apps/desktop/runtimes/claude/package-lock.json
                      apps/desktop/runtimes/pi/package-lock.json

            - name: Setup Rust toolchain
              uses: ./.github/actions/setup-rust
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin

            - name: Cache Rust build outputs
              uses: Swatinem/rust-cache@v2

            - name: Install desktop dependencies
              working-directory: apps/desktop
              run: npm ci

            - name: Build target-specific sidecars
              shell: bash
              run: |
                  cargo build -p neverwrite-native-backend --quiet --release --target aarch64-apple-darwin
                  cargo build -p neverwrite-native-backend --quiet --release --target x86_64-apple-darwin
                  node apps/desktop/scripts/run-with-codex-v8.mjs --target aarch64-apple-darwin --require-verified-artifacts -- cargo build --quiet --locked --manifest-path vendor/codex-acp/Cargo.toml --release --target aarch64-apple-darwin --bins
                  node apps/desktop/scripts/run-with-codex-v8.mjs --target x86_64-apple-darwin --require-verified-artifacts -- cargo build --quiet --locked --manifest-path vendor/codex-acp/Cargo.toml --release --target x86_64-apple-darwin --bins

            - name: Download embedded Node runtimes
              shell: bash
              run: |
                  NODE_VERSION="$(node -p "process.version.replace(/^v/, '')")"
                  DEST="$RUNNER_TEMP/node-dist"
                  mkdir -p "$DEST"

                  for NODE_DIST in darwin-arm64 darwin-x64; do
                    DIST="node-v${NODE_VERSION}-${NODE_DIST}"
                    curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${DIST}.tar.gz" -o "$RUNNER_TEMP/${NODE_DIST}.tar.gz"
                    tar -xzf "$RUNNER_TEMP/${NODE_DIST}.tar.gz" -C "$DEST"
                  done

                  echo "NEVERWRITE_EMBEDDED_NODE_BIN_ARM64=$DEST/node-v${NODE_VERSION}-darwin-arm64/bin/node" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_EMBEDDED_NODE_BIN_X64=$DEST/node-v${NODE_VERSION}-darwin-x64/bin/node" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_ELECTRON_OUTPUT_DIR=$RUNNER_TEMP/electron-dist" >> "$GITHUB_ENV"

            - name: Export sidecar environment
              shell: bash
              run: |
                  echo "NEVERWRITE_NATIVE_BACKEND_BUNDLE_BIN_ARM64=$GITHUB_WORKSPACE/target/aarch64-apple-darwin/release/neverwrite-native-backend" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_NATIVE_BACKEND_BUNDLE_BIN_X64=$GITHUB_WORKSPACE/target/x86_64-apple-darwin/release/neverwrite-native-backend" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_ACP_BUNDLE_BIN_ARM64=$GITHUB_WORKSPACE/vendor/codex-acp/target/aarch64-apple-darwin/release/codex-acp" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_ACP_BUNDLE_BIN_X64=$GITHUB_WORKSPACE/vendor/codex-acp/target/x86_64-apple-darwin/release/codex-acp" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_CODE_MODE_HOST_BUNDLE_BIN_ARM64=$GITHUB_WORKSPACE/vendor/codex-acp/target/aarch64-apple-darwin/release/codex-code-mode-host" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_CODE_MODE_HOST_BUNDLE_BIN_X64=$GITHUB_WORKSPACE/vendor/codex-acp/target/x86_64-apple-darwin/release/codex-code-mode-host" >> "$GITHUB_ENV"

            - name: Package unsigned Electron app
              working-directory: apps/desktop
              run: npm run electron:package:unsigned -- --platform mac --arch universal

            - name: Smoke packaged app executable
              working-directory: apps/desktop
              env:
                  NEVERWRITE_ELECTRON_DIST_ARCH: universal
              run: npm run electron:app:smoke:packaged

            - name: Smoke packaged sidecar
              working-directory: apps/desktop
              env:
                  NEVERWRITE_ELECTRON_DIST_ARCH: universal
              run: npm run electron:sidecar:smoke:packaged

            - name: Verify universal runtime binaries
              shell: bash
              run: |
                  APP_PATH=""
                  for candidate in \
                    "$NEVERWRITE_ELECTRON_OUTPUT_DIR/mac-universal/NeverWrite.app" \
                    "$NEVERWRITE_ELECTRON_OUTPUT_DIR/mac/NeverWrite.app"; do
                    if [[ -d "$candidate" ]]; then
                      APP_PATH="$candidate"
                      break
                    fi
                  done

                  if [[ -z "$APP_PATH" ]]; then
                    echo "Could not find packaged NeverWrite.app in $NEVERWRITE_ELECTRON_OUTPUT_DIR." >&2
                    exit 1
                  fi

                  verify_universal() {
                    local binary_path="$1"
                    local archs
                    archs="$(lipo -archs "$binary_path")"
                    echo "$binary_path: $archs"
                    if [[ "$archs" != "arm64 x86_64" && "$archs" != "x86_64 arm64" ]]; then
                      echo "Expected universal arm64/x86_64 binary: $binary_path" >&2
                      exit 1
                    fi
                  }

                  verify_universal "$APP_PATH/Contents/Resources/native-backend/neverwrite-native-backend"
                  verify_universal "$APP_PATH/Contents/Resources/native-backend/binaries/codex-acp"
                  verify_universal "$APP_PATH/Contents/Resources/native-backend/binaries/codex-code-mode-host"
                  verify_universal "$APP_PATH/Contents/Resources/native-backend/embedded/node/bin/node"
                  tar -czf "$RUNNER_TEMP/claude-universal.tgz" -C "$APP_PATH/Contents/Resources/native-backend" embedded/node embedded/claude-agent-acp

            - name: Preserve packaged universal Claude runtime for Intel smoke
              uses: actions/upload-artifact@v7
              with:
                  name: claude-universal-runtime
                  path: ${{ runner.temp }}/claude-universal.tgz
                  retention-days: 3

    claude-packaged-universal-intel:
        name: Packaged universal Claude (Intel slice)
        needs: macos-universal
        runs-on: macos-15-intel
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
            - uses: actions/download-artifact@v8
              with:
                  name: claude-universal-runtime
                  path: ${{ runner.temp }}/claude-universal
            - name: Install smoke tools
              working-directory: apps/desktop
              run: npm ci
            - name: Exercise the same packaged universal Node and Claude runtime
              shell: bash
              working-directory: apps/desktop
              run: |
                  tar -xzf "$RUNNER_TEMP/claude-universal/claude-universal.tgz" -C "$RUNNER_TEMP/claude-universal"
                  node scripts/smoke-claude-runtime.mjs --runtime "$RUNNER_TEMP/claude-universal/embedded/claude-agent-acp" --node "$RUNNER_TEMP/claude-universal/embedded/node/bin/node" --target universal-apple-darwin

    windows:
        name: Windows ${{ matrix.arch }}
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: windows-latest
                      target: x86_64-pc-windows-msvc
                      node_dist: win-x64
                    - arch: arm64
                      runner: windows-11-arm
                      target: aarch64-pc-windows-msvc
                      node_dist: win-arm64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      apps/desktop/package-lock.json
                      apps/desktop/runtimes/claude/package-lock.json
                      apps/desktop/runtimes/pi/package-lock.json

            - name: Setup Rust toolchain
              uses: ./.github/actions/setup-rust
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build outputs
              uses: Swatinem/rust-cache@v2

            - name: Install desktop dependencies
              working-directory: apps/desktop
              run: npm ci

            - name: Build target-specific sidecars
              shell: bash
              run: |
                  cargo build -p neverwrite-native-backend --quiet --release --target ${{ matrix.target }}
                  node apps/desktop/scripts/run-with-codex-v8.mjs --target ${{ matrix.target }} --require-verified-artifacts -- cargo build --quiet --locked --manifest-path vendor/codex-acp/Cargo.toml --release --target ${{ matrix.target }} --bins

            - name: Download embedded Node runtime
              shell: bash
              run: |
                  NODE_VERSION="$(node -p "process.version.replace(/^v/, '')")"
                  DIST="node-v${NODE_VERSION}-${{ matrix.node_dist }}"
                  DEST="$RUNNER_TEMP/node-dist"
                  mkdir -p "$DEST"
                  curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${DIST}.zip" -o "$RUNNER_TEMP/node.zip"
                  powershell -NoProfile -Command "Expand-Archive -Path (Join-Path \$env:RUNNER_TEMP 'node.zip') -DestinationPath (Join-Path \$env:RUNNER_TEMP 'node-dist') -Force"
                  echo "NEVERWRITE_EMBEDDED_NODE_BIN=$DEST/${DIST}/node.exe" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_ELECTRON_OUTPUT_DIR=$RUNNER_TEMP/electron-dist" >> "$GITHUB_ENV"

            - name: Export sidecar environment
              shell: bash
              run: |
                  NATIVE_BACKEND_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/neverwrite-native-backend.exe"
                  CODEX_BIN="$GITHUB_WORKSPACE/vendor/codex-acp/target/${{ matrix.target }}/release/codex-acp.exe"
                  CODEX_CODE_MODE_HOST_BIN="$GITHUB_WORKSPACE/vendor/codex-acp/target/${{ matrix.target }}/release/codex-code-mode-host.exe"
                  echo "NEVERWRITE_NATIVE_BACKEND_BUNDLE_BIN=$NATIVE_BACKEND_BIN" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_ACP_BUNDLE_BIN=$CODEX_BIN" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_CODE_MODE_HOST_BUNDLE_BIN=$CODEX_CODE_MODE_HOST_BIN" >> "$GITHUB_ENV"

            - name: Package unsigned Electron app
              working-directory: apps/desktop
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
              run: npm run electron:package:unsigned -- --platform win --arch ${{ matrix.arch }}

            - name: Smoke packaged sidecar
              working-directory: apps/desktop
              env:
                  NEVERWRITE_ELECTRON_DIST_ARCH: ${{ matrix.arch }}
              run: npm run electron:sidecar:smoke:packaged

            - name: Verify packaged Codex runtime files
              shell: bash
              run: |
                  for binary in codex-acp.exe codex-code-mode-host.exe; do
                    mapfile -t matches < <(find "$NEVERWRITE_ELECTRON_OUTPUT_DIR" -type f -path "*/resources/native-backend/binaries/$binary")
                    if [[ "${#matches[@]}" -ne 1 ]]; then
                      echo "Expected one packaged $binary, found ${#matches[@]}." >&2
                      exit 1
                    fi
                    echo "Packaged $binary: ${matches[0]}"
                  done

    linux:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.runner }}
        # The hosted runner is 26.04; the container preserves the 22.04 binary ABI.
        container: ubuntu:22.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux x64
                      runner: ubuntu-26.04
                      arch: x64
                      target: x86_64-unknown-linux-gnu
                    - name: Linux ARM64
                      runner: ubuntu-26.04-arm
                      arch: arm64
                      target: aarch64-unknown-linux-gnu

        steps:
            - name: Bootstrap Linux build container
              shell: bash
              run: |
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git sudo

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      apps/desktop/package-lock.json
                      apps/desktop/runtimes/claude/package-lock.json
                      apps/desktop/runtimes/pi/package-lock.json

            - name: Setup Rust toolchain
              uses: ./.github/actions/setup-rust
              with:
                  targets: ${{ matrix.target }}

            - name: Cache Rust build outputs
              uses: Swatinem/rust-cache@v2

            - name: Install Linux build dependencies
              shell: bash
              run: |
                  sudo apt-get update
                  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
                    build-essential file libcap-dev libssl-dev pkg-config rpm wget \
                    libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
                    libdrm2 libgbm1 libgtk-3-0 libnss3 libxcomposite1 \
                    libxdamage1 libxfixes3 libxkbcommon0 libxrandr2 libxss1

            - name: Install desktop dependencies
              working-directory: apps/desktop
              run: npm ci

            - name: Build target-specific sidecars
              shell: bash
              run: |
                  cargo build -p neverwrite-native-backend --quiet --release --target ${{ matrix.target }}
                  node apps/desktop/scripts/run-with-codex-v8.mjs --target ${{ matrix.target }} --require-verified-artifacts -- cargo build --quiet --locked --manifest-path vendor/codex-acp/Cargo.toml --release --target ${{ matrix.target }} --bins

            - name: Test vendored Codex product contracts
              shell: bash
              run: |
                  node apps/desktop/scripts/run-with-codex-v8.mjs --target ${{ matrix.target }} --require-verified-artifacts -- cargo test --locked --manifest-path vendor/codex-acp/Cargo.toml --release --target ${{ matrix.target }} --lib --test code_mode_host_smoke

            - name: Export sidecar environment
              shell: bash
              run: |
                  NATIVE_BACKEND_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/neverwrite-native-backend"
                  CODEX_BIN="$GITHUB_WORKSPACE/vendor/codex-acp/target/${{ matrix.target }}/release/codex-acp"
                  CODEX_CODE_MODE_HOST_BIN="$GITHUB_WORKSPACE/vendor/codex-acp/target/${{ matrix.target }}/release/codex-code-mode-host"
                  echo "NEVERWRITE_NATIVE_BACKEND_BUNDLE_BIN=$NATIVE_BACKEND_BIN" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_ACP_BUNDLE_BIN=$CODEX_BIN" >> "$GITHUB_ENV"
                  echo "NEVERWRITE_CODEX_CODE_MODE_HOST_BUNDLE_BIN=$CODEX_CODE_MODE_HOST_BIN" >> "$GITHUB_ENV"

            - name: Package unsigned Electron app
              working-directory: apps/desktop
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: "false"
                  NEVERWRITE_ELECTRON_OUTPUT_DIR: ${{ runner.temp }}/electron-dist
              run: npm run electron:release:local -- --platform linux --arch ${{ matrix.arch }} --unsigned

            - name: Smoke packaged sidecar
              working-directory: apps/desktop
              env:
                  NEVERWRITE_ELECTRON_OUTPUT_DIR: ${{ runner.temp }}/electron-dist
                  NEVERWRITE_ELECTRON_DIST_ARCH: ${{ matrix.arch }}
              run: npm run electron:sidecar:smoke:packaged

            - name: Smoke packaged app executable
              working-directory: apps/desktop
              env:
                  NEVERWRITE_ELECTRON_OUTPUT_DIR: ${{ runner.temp }}/electron-dist
                  NEVERWRITE_ELECTRON_DIST_ARCH: ${{ matrix.arch }}
              run: npm run electron:app:smoke:packaged

            - name: Verify packaged Codex runtime files
              shell: bash
              env:
                  NEVERWRITE_ELECTRON_OUTPUT_DIR: ${{ runner.temp }}/electron-dist
              run: |
                  for binary in codex-acp codex-code-mode-host; do
                    mapfile -t matches < <(find "$NEVERWRITE_ELECTRON_OUTPUT_DIR" -type f -path "*/resources/native-backend/binaries/$binary")
                    if [[ "${#matches[@]}" -ne 1 ]]; then
                      echo "Expected one packaged $binary, found ${#matches[@]}." >&2
                      exit 1
                    fi
                    if [[ ! -x "${matches[0]}" ]]; then
                      echo "Packaged $binary is not executable: ${matches[0]}" >&2
                      exit 1
                    fi
                    echo "Packaged $binary: ${matches[0]}"
                  done

            - name: Stage release assets and feed metadata
              shell: bash
              run: |
                  VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  mkdir -p "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/target-metadata"
                  node apps/desktop/scripts/stage-electron-release-assets.mjs \
                    --dist-dir "$RUNNER_TEMP/electron-dist" \
                    --target ${{ matrix.target }} \
                    --version "$VERSION" \
                    --tag "v$VERSION" \
                    --repo "${{ github.repository }}" \
                    --output-dir "$RUNNER_TEMP/release-assets" \
                    --metadata-out "$RUNNER_TEMP/target-metadata/${{ matrix.target }}.json"

            - name: Validate Linux Debian package
              shell: bash
              run: |
                  VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  node apps/desktop/scripts/validate-linux-deb-package.mjs \
                    --staged-assets-dir "$RUNNER_TEMP/release-assets" \
                    --target ${{ matrix.target }} \
                    --version "$VERSION" \
                    --install

            - name: Validate Linux RPM package
              shell: bash
              run: |
                  VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  node apps/desktop/scripts/validate-linux-rpm-package.mjs \
                    --staged-assets-dir "$RUNNER_TEMP/release-assets" \
                    --target ${{ matrix.target }} \
                    --version "$VERSION"

            - name: Smoke Linux AppImage on Ubuntu 22.04
              shell: bash
              run: |
                  VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  appimage="$RUNNER_TEMP/release-assets/NeverWrite-${VERSION}-${{ matrix.arch }}.AppImage"
                  test -f "$appimage"
                  chmod +x "$appimage"
                  APPIMAGE_EXTRACT_AND_RUN=1 ELECTRON_RUN_AS_NODE=1 \
                    "$appimage" -e 'process.exit(0)'

            - name: Upload Linux package artifacts for Fedora smoke
              uses: actions/upload-artifact@v7
              with:
                  name: linux-package-assets-${{ matrix.arch }}
                  path: |
                      ${{ runner.temp }}/release-assets/*.rpm
                      ${{ runner.temp }}/release-assets/*.AppImage
                  if-no-files-found: error

    linux-fedora-compat:
        name: Fedora 43 package smoke (${{ matrix.arch }})
        needs: linux
        runs-on: ${{ matrix.runner }}
        container: fedora:43
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-26.04
                    - arch: arm64
                      runner: ubuntu-26.04-arm
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: linux-package-assets-${{ matrix.arch }}
                  path: ${{ runner.temp }}/linux-packages

            - name: Install and smoke RPM on Fedora 43
              shell: bash
              run: |
                  shopt -s nullglob
                  packages=("$RUNNER_TEMP"/linux-packages/*.rpm)
                  if [[ "${#packages[@]}" -ne 1 ]]; then
                    echo "Expected one RPM package, found ${#packages[@]}." >&2
                    exit 1
                  fi
                  dnf install -y "${packages[0]}"
                  rpm -q neverwrite
                  ELECTRON_RUN_AS_NODE=1 neverwrite -e 'process.exit(0)'

            - name: Smoke AppImage on Fedora 43
              shell: bash
              run: |
                  shopt -s nullglob
                  images=("$RUNNER_TEMP"/linux-packages/*.AppImage)
                  if [[ "${#images[@]}" -ne 1 ]]; then
                    echo "Expected one AppImage, found ${#images[@]}." >&2
                    exit 1
                  fi
                  chmod +x "${images[0]}"
                  APPIMAGE_EXTRACT_AND_RUN=1 ELECTRON_RUN_AS_NODE=1 \
                    "${images[0]}" -e 'process.exit(0)'
